{% extends "marketplace/base.html" %}
{% block title %}Edit {{ product.title }}{% endblock %}
{% block content %}
<h2>Edit Listing</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% if product.image %}
        <p>Current image: <img src="{{ product.image.url }}" width="100" alt="{{ product.title }}"></p>
    {% endif %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'marketplace:product_detail' pk=product.pk %}" class="btn btn-outline-danger">Cancel</a>
</form>
{% endblock %}
