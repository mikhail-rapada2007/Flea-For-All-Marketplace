{% extends "marketplace/base.html" %}

{% block title %}Report Item{% endblock %}

{% block content %}
<div class="market-card p-4 mx-auto" style="max-width: 600px;">
  <h2 class="text-white mb-4">Report "{{ product.title }}"</h2>
  <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger mt-2">Submit Report</button>
  </form>
</div>
{% endblock %}
