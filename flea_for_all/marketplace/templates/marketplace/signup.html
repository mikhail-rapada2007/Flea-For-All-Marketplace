{% extends "marketplace/base.html" %}

{% block title %}Sign Up - Flea For All Marketplace{% endblock %}


{% block content %}
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="section-badge px-4 py-2 fs-3">Sign Up</span>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-market">Sign Up</button>
    </form>

    <div class="auth-footer text-center mt-4 text-white-50">
      Already have an account? <a href="{% url 'login' %}">Log in</a>
    </div>
  </div>
{% endblock %}
