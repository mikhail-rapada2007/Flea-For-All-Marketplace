{% extends "marketplace/base.html" %}

{% block title %}Log In - Flea For All Marketplace{% endblock %}

{% block extra_css %}

<style>
  .auth-card {
    max-width: 500px;
    margin: 2rem auto;
    background-color: var(--card-brown);
    border-radius: 22px;
    padding: 2.75rem 2.25rem;
    color: #ffffff;
    box-shadow: 0 12px 30px rgba(82, 67, 54, 0.15);
  }

  .auth-card label {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 0.4rem;
    display: block;
    color: #ffffff;
    letter-spacing: 0.3px;
  }

  /* INPUT FIELDS */
  .auth-card input[type="text"],
  .auth-card input[type="password"],
  .auth-card input[type="email"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: 2px solid transparent;
    background-color: var(--bg-col);
    color: var(--card-brown);
    font-weight: 600;
    font-size: 1.1rem;
    font-family: var(--font-defult);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .auth-card input:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(75, 180, 230, 0.25);
  }

  .auth-card p {
    margin-bottom: 1.25rem;
  }

  .auth-card .helptext {
    display: block;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 0.35rem;
    line-height: 1.3;
  }

  .auth-card ul.errorlist {
    list-style: none;
    padding: 0;
    margin: 0 0 0.5rem 0;
    color: #ff8585;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .btn-market {
    width: 100%;
    background-color: var(--bg-col);
    color: var(--card-brown);
    font-weight: 800;
    font-size: 1.1rem;
    padding: 0.85rem;
    border-radius: 12px;
    border: none;
    transition: transform 0.15s ease, background-color 0.15s ease;
    margin-top: 0.5rem;
  }

  .btn-market:hover {
    background-color: #ffffff;
    transform: translateY(-2px);
    color: var(--card-brown-hover);
  }

  .auth-footer a {
    color: var(--accent-pink);
    font-weight: 700;
    text-decoration: none;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="section-badge px-4 py-2 fs-3">Log In</span>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-market">Log In</button>
    </form>

    <div class="auth-footer text-center mt-4 text-white-50">
      <p>Don't have an account? <a href="{% url 'marketplace:signup' %}">Sign up</a></p>
    </div>
  </div>
{% endblock %}
