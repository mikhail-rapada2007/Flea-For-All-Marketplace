{% extends "marketplace/base.html" %}

{% block title %}Log In - Flea For All Marketplace{% endblock %}

{% block content %}
  <div class="auth-card">
    <div class="text-center mb-4">
      <span class="section-badge px-4 py-2 fs-3">Log In</span>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-market">Log In</button>
    </form>

    <div class="auth-footer text-center mt-4 text-white-50">
      <p>Don't have an account? <a href="{% url 'marketplace:signup' %}">Sign up</a></p>
    </div>
  </div>
{% endblock %}
